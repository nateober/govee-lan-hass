name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new Home Assistant release that breaks us fails here first.
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # This fork is not submitted to the default store.
          ignore: topics

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv venv && uv pip install -r requirements_test.txt
      - run: uv run --no-project ruff check .
      # Unpinned on purpose: always tests against the newest HA that the
      # test harness has published.
      - run: uv run --no-project pytest -W "error::DeprecationWarning:custom_components.govee_lan"
